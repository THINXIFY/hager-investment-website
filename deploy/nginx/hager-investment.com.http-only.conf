# STEP 1 (temporary): HTTP only, so Let's Encrypt can verify the domain.
# Replaced by hager-investment.com.conf once the certificate exists (see DEPLOYMENT.md).
# Only answers for hager-investment.com and www.hager-investment.com; other sites are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name hager-investment.com www.hager-investment.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hager-investment-acme;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
