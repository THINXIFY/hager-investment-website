# HAGER INVESTMENT: production Nginx site (HTTPS).
# Canonical address: https://hager-investment.com  (www and plain HTTP redirect here).
# Proxies to the Docker container on 127.0.0.1:3100 (if you change HAGER_PORT, change it here too). Only answers for these two hostnames,
# and every shared name below is prefixed "hager_" so nothing clashes with other sites.
#
# Install:  sudo cp deploy/nginx/hager-investment.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/hager-investment.com.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

# Gentle rate limit for the form / email-code endpoints (per visitor IP)
limit_req_zone $binary_remote_addr zone=hager_api:10m rate=20r/m;

upstream hager_investment_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

# ---- HTTP: certificate renewals, then everything to https://hager-investment.com ----
server {
    listen 80;
    listen [::]:80;
    server_name hager-investment.com www.hager-investment.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hager-investment-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://hager-investment.com$request_uri;
    }
}

# ---- HTTPS www: redirect to the canonical domain ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hager-investment.com;

    ssl_certificate     /etc/letsencrypt/live/hager-investment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hager-investment.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hager_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://hager-investment.com$request_uri;
}

# ---- HTTPS: the website ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hager-investment.com;

    ssl_certificate     /etc/letsencrypt/live/hager-investment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hager-investment.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hager_ssl:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Forms carry text only
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    access_log /var/log/nginx/hager-investment.access.log;
    error_log  /var/log/nginx/hager-investment.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hager-investment-acme;
        default_type "text/plain";
    }

    # Contact form and private-document email codes: rate limited
    location /api/ {
        limit_req zone=hager_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://hager_investment_app;
        include /etc/nginx/snippets/hager-investment-proxy.conf;
    }

    location / {
        proxy_pass http://hager_investment_app;
        include /etc/nginx/snippets/hager-investment-proxy.conf;
    }
}
